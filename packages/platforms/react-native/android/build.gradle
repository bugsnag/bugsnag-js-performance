import groovy.json.JsonSlurper

// Returns [major, minor] of the app's react-native dependency, or null if it can't be found
def getReactNativeVersion() {
  def candidates = [
    // installed as node_modules/@bugsnag/react-native-performance/android
    new File(projectDir, "../../../react-native/package.json"),
    // standard app layout: <app>/android is the root project
    new File(rootProject.projectDir, "../node_modules/react-native/package.json")
  ]
  def packageJson = candidates.find { it.exists() }
  if (packageJson == null) {
    return null
  }
  try {
    def parts = new JsonSlurper().parse(packageJson).version.tokenize('.-')
    return [parts[0].toInteger(), parts[1].toInteger()]
  } catch (Exception ignored) {
    return null
  }
}

def isNewArchitectureEnabled() {
  // React Native 0.82+ only supports the new architecture and ignores the newArchEnabled property
  def rnVersion = getReactNativeVersion()
  if (rnVersion != null && (rnVersion[0] > 0 || rnVersion[1] >= 82)) {
    return true
  }
  return project.hasProperty("newArchEnabled") && project.newArchEnabled == "true"
}

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

apply plugin: 'com.android.library'
if (isNewArchitectureEnabled()) {
  apply plugin: 'com.facebook.react'
}

android {
  compileSdkVersion safeExtGet('compileSdkVersion', 29)

  defaultConfig {
    consumerProguardFiles 'proguard-rules.pro'
  }

  if (android.hasProperty('namespace')) {
    namespace 'com.bugsnag.reactnative.performance'
  }

  sourceSets {
    main {
      if (isNewArchitectureEnabled()) {
        java.srcDirs += ['src/newarch/java']
      } else {
        java.srcDirs += ['src/oldarch/java']
      }
    }
  }
}

repositories {
  mavenCentral()
  google()
}

dependencies {
  implementation 'com.facebook.react:react-native'
  compileOnly("com.bugsnag:bugsnag-android-performance:2.0.0")
  compileOnly("com.bugsnag:bugsnag-android-performance-impl:2.0.0")
}
